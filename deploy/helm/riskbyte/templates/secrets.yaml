apiVersion: v1
kind: Secret
metadata:
  name: {{ include "riskbyte.fullname" . }}-secrets
  labels:
    {{- include "riskbyte.labels" . | nindent 4 }}
type: Opaque
stringData:
  RISKBYTE_DATABASE_URL: {{ .Values.config.databaseUrl | quote }}
  RISKBYTE_REDIS_URL: {{ .Values.config.redisUrl | quote }}
  RISKBYTE_ADMIN_PASSWORD: {{ .Values.postgresql.auth.password | quote }}
