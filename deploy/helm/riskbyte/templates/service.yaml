apiVersion: v1
kind: Service
metadata:
  name: {{ include "riskbyte.fullname" . }}
  labels:
    {{- include "riskbyte.labels" . | nindent 4 }}
spec:
  type: {{ .Values.service.type }}
  ports:
    - port: {{ .Values.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - port: {{ .Values.service.syslogPort }}
      targetPort: syslog
      protocol: UDP
      name: syslog
  selector:
    {{- include "riskbyte.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: app
