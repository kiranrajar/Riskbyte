apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "riskbyte.fullname" . }}-app
  labels:
    {{- include "riskbyte.labels" . | nindent 4 }}
    app.kubernetes.io/component: app
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: {{ .Values.strategy.type }}
  selector:
    matchLabels:
      {{- include "riskbyte.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: app
  template:
    metadata:
      labels:
        {{- include "riskbyte.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: app
    spec:
      securityContext:
        {{- toYaml .Values.securityContext | nindent 8 }}
      containers:
        - name: app
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.containerSecurityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: syslog
              containerPort: 5514
              protocol: UDP
          envFrom:
            - configMapRef:
                name: {{ include "riskbyte.fullname" . }}-config
            - secretRef:
                name: {{ include "riskbyte.fullname" . }}-secrets
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          volumeMounts:
            - name: platform-data
              mountPath: /data
            - name: tmp-dir
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 15
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: platform-data
          persistentVolumeClaim:
            claimName: {{ include "riskbyte.fullname" . }}-data-pvc
        - name: tmp-dir
          emptyDir:
            medium: Memory
            sizeLimit: 512Mi
