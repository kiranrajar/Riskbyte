apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "riskbyte.fullname" . }}-config
  labels:
    {{- include "riskbyte.labels" . | nindent 4 }}
data:
  RISKBYTE_ENV: {{ .Values.config.env | quote }}
  RISKBYTE_AIR_GAPPED: {{ .Values.config.airGapped | quote }}
  RISKBYTE_EGRESS_DENY: {{ .Values.config.egressDeny | quote }}
  RISKBYTE_LLM_MODEL: {{ .Values.config.llmModel | quote }}
  RISKBYTE_OLLAMA_URL: {{ .Values.config.ollamaUrl | quote }}
  RISKBYTE_OPENSEARCH_URL: {{ .Values.config.opensearchUrl | quote }}
  RISKBYTE_DATA_DIR: "/data"
  RISKBYTE_BIND: "0.0.0.0"
  RISKBYTE_PORT: "8080"
  RISKBYTE_SYSLOG_PORT: "5514"
